# Release: quando si pubblica un tag vX.Y.Z, GitHub compila l'app dal codice pubblico, esegue i test
# e pubblica zip + SHA-256 + attestazione di provenienza. Chi scarica può verificare con:
#   gh attestation verify StayAwake.zip -R ricky7x/StayAwake
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write      # creare la release
      id-token: write      # firmare l'attestazione
      attestations: write  # salvare l'attestazione
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test e build universale
        run: ./release.sh
      - name: Attestazione di provenienza
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/StayAwake.zip
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/StayAwake.zip build/release/StayAwake.zip.sha256 \
            --verify-tag --title "StayAwake $GITHUB_REF_NAME" --generate-notes
